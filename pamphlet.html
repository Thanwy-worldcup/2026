<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>البامفلت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=flipbook1">
</head>
<body>

<header class="site-header">
  <div class="container">
    <div class="brand">
      <img src="assets/img/logo.jpg" alt="لوجو المؤتمر">
      <div>
        <span class="brand-name">مؤتمر شباب ثانوي</span>
        <div class="brand-sub">كنيسة البابا اثناسيوس الرسولي - بقليوب المحطة</div>
      </div>
    </div>
    <button class="nav-toggle" onclick="toggleNav()" aria-label="فتح القائمة" aria-expanded="false">☰</button>
    <nav class="main-nav" id="mainNav" onclick="if(event.target===this) toggleNav()">
      <a href="index.html">الرئيسية</a>
      <a href="teams.html">المنتخبات</a>
      <a href="pamphlet.html">البامفلت</a>
      <a href="schedule.html">الأنشطة والمواعيد</a>
      <a href="rules.html">اللوائح</a>
      <a href="gallery.html">معرض الصور</a>
    </nav>
  </div>
</header>

<main class="pamphlet-book-page">
  <section class="flipbook-stage" aria-label="بامفلت المؤتمر">
    <div class="book-shell">
      <div id="flipbook" class="flipbook"></div>
    </div>

    <div class="book-controls" aria-label="أدوات تقليب الصفحات">
      <button type="button" class="book-btn book-next" id="nextPage" aria-label="الصفحة التالية">‹</button>
      <div class="page-counter">
        <span id="pageCurrent">غلاف</span>
        <span class="counter-sep">/</span>
        <span class="page-total">١٠</span>
      </div>
      <button type="button" class="book-btn book-prev" id="prevPage" aria-label="الصفحة السابقة">›</button>
    </div>

    <p class="book-hint">اضغط على الغلاف لفتح الكتيب أو اسحب الصفحات للتقليب</p>
  </section>
</main>

<footer class="site-footer">
  <div class="container footer-flex">
    <div class="footer-verse" data-footer-verse></div>
    <div class="footer-qr-badge">
      <img src="assets/img/qr-code.png" alt="امسح لفتح الموقع">
    </div>
  </div>
</footer>

<!-- محرك تقليب الصفحات -->
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script src="assets/app.js?v=flipbook1"></script>
<script>
(() => {
  const ARABIC_DIGITS = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];

  function toArabicDigits(value) {
    return String(value).replace(/\d/g, d => ARABIC_DIGITS[d]);
  }

  function initPamphletBook() {
    const host = document.getElementById('flipbook');
    if (!host || !window.St || !window.St.PageFlip) return;

    const isMobile = window.matchMedia('(max-width: 700px)').matches;

    /*
      كتاب عربي حقيقي:
      الغلاف الأمامي = أول صفحة (يمين عند البداية)
      ثم الصفحات ١ → ١٠
      ثم الغلاف الخلفي = آخر صفحة (يسار في النهاية)
    */
    const pagesData = [
      { type: 'cover', density: 'hard' },
      ...Array.from({ length: 10 }, (_, i) => ({
        type: 'page',
        number: i + 1,
        density: 'soft'
      })),
      { type: 'back-cover', density: 'hard' }
    ];

    const pages = pagesData.map((item) => {
      const page = document.createElement('div');
      page.className = `book-page ${item.type}`;
      page.dataset.type = item.type;
      if (item.number) page.dataset.pageNumber = String(item.number);
      page.dataset.density = item.density;

      if (item.type === 'cover') {
        page.innerHTML = `
          <div class="cover-inner" role="button" tabindex="0" aria-label="اضغط لفتح الكتيب">
            <div class="cover-fallback">
              <div class="cover-trophy">🏆</div>
              <div class="cover-title">كأس العالم</div>
              <div class="cover-year">2026</div>
              <div class="cover-open">اضغط لفتح الكتيب</div>
            </div>
          </div>`;
      } else if (item.type === 'back-cover') {
        page.innerHTML = `
          <div class="back-cover-inner">
            <div class="cover-trophy">🏆</div>
            <div class="back-title">نهاية الكتيب</div>
            <div class="back-sub">شكرًا لقراءتك</div>
          </div>`;
      } else {
        page.innerHTML = `
          <div class="page-inner">
            <span class="page-corner page-corner-tl"></span>
            <span class="page-corner page-corner-tr"></span>
            <span class="page-corner page-corner-bl"></span>
            <span class="page-corner page-corner-br"></span>
            <span class="page-number">${toArabicDigits(item.number)}</span>
          </div>`;
      }

      host.appendChild(page);
      return page;
    });

    const pageFlip = new St.PageFlip(host, {
      width: 620,
      height: 860,
      size: 'stretch',
      minWidth: 280,
      maxWidth: 900,
      minHeight: 390,
      maxHeight: 980,
      drawShadow: true,
      maxShadowOpacity: 0.42,
      showCover: true,
      mobileScrollSupport: false,
      useMouseEvents: true,
      swipeDistance: 28,
      flippingTime: 900,
      usePortrait: true,
      startPage: 0
    });

    pageFlip.loadFromHTML(host.querySelectorAll('.book-page'));

    const current = document.getElementById('pageCurrent');
    const prev = document.getElementById('prevPage');
    const next = document.getElementById('nextPage');

    function getLogicalPage(index) {
      const item = pagesData[index];
      if (!item) return { label: 'غلاف', number: null, type: 'cover' };
      if (item.number) return { label: toArabicDigits(item.number), number: item.number, type: 'page' };
      return { label: 'غلاف', number: null, type: item.type };
    }

    function update() {
      const index = pageFlip.getCurrentPageIndex();
      const item = getLogicalPage(index);

      if (item.type === 'cover') {
        current.textContent = 'غلاف';
      } else if (item.type === 'back-cover') {
        current.textContent = 'نهاية';
      } else {
        current.textContent = item.label;
      }

      prev.disabled = index <= 0;
      next.disabled = index >= pagesData.length - 1;
    }

    pageFlip.on('flip', update);

    // الأسهم بالعربي: التالي ناحية اليسار، السابق ناحية اليمين.
    next.addEventListener('click', () => pageFlip.flipNext());
    prev.addEventListener('click', () => pageFlip.flipPrev());

    // لوحة المفاتيح بنفس اتجاه الكتاب العربي.
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        pageFlip.flipNext();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        pageFlip.flipPrev();
      }
    });

    /*
      على الموبايل:
      سحب من اليمين إلى اليسار = التالي
      سحب من اليسار إلى اليمين = السابق
      لأن الغلاف والكتاب العربي يفتحان من اليمين باتجاه اليسار.
      نترك المحرك يتولى الحركة نفسها، ونضمن فقط منطق الاتجاه.
    */
    if (isMobile) {
      let startX = null;
      let startY = null;

      host.addEventListener('touchstart', (e) => {
        if (!e.touches?.[0]) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, { passive: true, capture: true });

      host.addEventListener('touchend', (e) => {
        if (startX === null || !e.changedTouches?.[0]) return;

        const dx = e.changedTouches[0].clientX - startX;
        const dy = e.changedTouches[0].clientY - startY;
        startX = startY = null;

        if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) return;

        // RTL book: right -> left = next.
        if (dx < 0) {
          pageFlip.flipNext();
        } else {
          pageFlip.flipPrev();
        }
      }, { passive: true, capture: true });
    }

    // فتح الغلاف بالضغط عليه.
    const cover = host.querySelector('.book-page.cover .cover-inner');
    if (cover) {
      const openCover = () => pageFlip.flipNext();
      cover.addEventListener('click', openCover);
      cover.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openCover();
        }
      });
    }

    update();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initPamphletBook);
  } else {
    initPamphletBook();
  }
})();
</script>
<script>markActiveNav(); renderFooterVerse(5);</script>
</body>
</html>
