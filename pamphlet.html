<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>البامفلت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/page-flip.css">
<link rel="stylesheet" href="assets/style.css?v=3">
</head>
<body>

<header class="site-header">
  <div class="container">
    <div class="brand">
      <img src="assets/img/logo.jpg" alt="لوجو المؤتمر">
      <div>
        <span class="brand-name">مؤتمر شباب ثانوي</span>
        <div class="brand-sub">كنيسة البابا اثناسيوس الرسولي - بقليوب المحطة</div>
      </div>
    </div>
    <button class="nav-toggle" onclick="toggleNav()" aria-label="فتح القائمة" aria-expanded="false">☰</button>
    <nav class="main-nav" id="mainNav" onclick="if(event.target===this) toggleNav()">
      <a href="index.html">الرئيسية</a>
      <a href="teams.html">المنتخبات</a>
      <a href="pamphlet.html">البامفلت</a>
      <a href="schedule.html">الأنشطة والمواعيد</a>
      <a href="rules.html">اللوائح</a>
      <a href="gallery.html">معرض الصور</a>
    </nav>
  </div>
</header>

<section class="page-hero">
  <div class="container">
    <img class="hero-icon-img" src="assets/img/pamphlet-icon.png" alt="">
    <h2>البامفلت</h2>
    <p class="verse">دوس على الغلاف وابدأ تقلب الصفحات 👇</p>
  </div>
</section>

<div class="container book-wrap">
  <div class="book-rtl-flip">
    <div id="stpageflip-book" class="stpageflip-book">

      <!-- الغلاف -->
      <div class="page" data-density="hard">
        <div class="page-content">
          <span class="page-num">غلاف</span>
        </div>
      </div>

      <!-- صفحة 1 -->
      <div class="page">
        <div class="page-content"><span class="page-num">1</span></div>
      </div>
      <!-- صفحة 2 -->
      <div class="page">
        <div class="page-content"><span class="page-num">2</span></div>
      </div>
      <!-- صفحة 3 -->
      <div class="page">
        <div class="page-content"><span class="page-num">3</span></div>
      </div>
      <!-- صفحة 4 -->
      <div class="page">
        <div class="page-content"><span class="page-num">4</span></div>
      </div>
      <!-- صفحة 5 -->
      <div class="page">
        <div class="page-content"><span class="page-num">5</span></div>
      </div>
      <!-- صفحة 6 -->
      <div class="page">
        <div class="page-content"><span class="page-num">6</span></div>
      </div>
      <!-- صفحة 7 -->
      <div class="page">
        <div class="page-content"><span class="page-num">7</span></div>
      </div>
      <!-- صفحة 8 -->
      <div class="page">
        <div class="page-content"><span class="page-num">8</span></div>
      </div>
      <!-- صفحة 9 -->
      <div class="page">
        <div class="page-content"><span class="page-num">9</span></div>
      </div>
      <!-- صفحة 10 -->
      <div class="page">
        <div class="page-content"><span class="page-num">10</span></div>
      </div>

      <!-- الغلاف الخلفي -->
      <div class="page" data-density="hard">
        <div class="page-content">
          <span class="page-num">النهاية</span>
        </div>
      </div>

    </div>
  </div>

  <button class="flip-arrow flip-arrow-prev" data-flip-prev aria-label="السابق">‹</button>
  <button class="flip-arrow flip-arrow-next" data-flip-next aria-label="التالي">›</button>
</div>

<div class="flip-controls">
  <button class="flip-ctrl-btn" data-flip-prev>‹ السابق</button>
  <span class="flip-counter"><span data-flip-current>1</span> / <span data-flip-total>12</span></span>
  <button class="flip-ctrl-btn" data-flip-next>التالي ›</button>
</div>

<footer class="site-footer">
  <div class="container footer-flex">
    <div class="footer-verse" data-footer-verse></div>
    <div class="footer-qr-badge">
      <img src="assets/img/qr-code.png" alt="امسح لفتح الموقع">
    </div>
  </div>
</footer>

<script src="assets/vendor/page-flip.browser.js"></script>
<script src="assets/app.js?v=3"></script>
<script>
  markActiveNav();
  renderFooterVerse(5);
  initFlipbook();
</script>
</body>
</html>
