<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>البامفلت | مؤتمر شباب ثانوي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=3">
</head>
<body class="pamphlet-page-body">

<header class="site-header">
  <div class="container">
    <div class="brand">
      <img src="assets/img/logo.jpg" alt="لوجو المؤتمر">
      <div>
        <span class="brand-name">مؤتمر شباب ثانوي</span>
        <div class="brand-sub">كنيسة البابا اثناسيوس الرسولي - بقليوب المحطة</div>
      </div>
    </div>
    <button class="nav-toggle" onclick="toggleNav()" aria-label="فتح القائمة" aria-expanded="false">☰</button>
    <nav class="main-nav" id="mainNav" onclick="if(event.target===this) toggleNav()">
      <a href="index.html">الرئيسية</a>
      <a href="teams.html">المنتخبات</a>
      <a href="pamphlet.html">البامفلت</a>
      <a href="schedule.html">الأنشطة والمواعيد</a>
      <a href="rules.html">اللوائح</a>
      <a href="gallery.html">معرض الصور</a>
    </nav>
  </div>
</header>

<main class="pamphlet-book-shell">
  <div class="pamphlet-topbar">
    <div class="pamphlet-book-title">📖 بامفلت المؤتمر</div>
    <div class="pamphlet-page-counter" id="pageCounter">صفحة ١ من ١٠</div>
    <button class="pamphlet-index-btn" id="indexBtn" type="button">الفهرس</button>
  </div>

  <div class="pamphlet-book" id="pamphletBook" aria-live="polite">
    <div class="pamphlet-paper-shadow"></div>
    <article class="pamphlet-paper" id="pamphletPaper">
      <div class="paper-corner paper-corner-top"></div>
      <div class="paper-corner paper-corner-bottom"></div>
      <div class="paper-content" id="paperContent"></div>
    </article>
  </div>

  <div class="pamphlet-controls">
    <button class="page-arrow" id="prevBtn" type="button" aria-label="الصفحة السابقة">‹</button>
    <div class="page-dots" id="pageDots"></div>
    <button class="page-arrow" id="nextBtn" type="button" aria-label="الصفحة التالية">›</button>
  </div>

  <div class="pamphlet-hint">اسحب يمينًا أو يسارًا لقلب الصفحة • أو استخدم الأسهم</div>
</main>

<div class="pamphlet-index" id="pamphletIndex" aria-hidden="true">
  <div class="pamphlet-index-card">
    <button class="index-close" id="indexClose" type="button" aria-label="إغلاق">×</button>
    <div class="index-title">فهرس البامفلت</div>
    <div class="index-list" id="indexList"></div>
  </div>
</div>

<script src="assets/app.js?v=3"></script>
<script>
markActiveNav();

/* ----------------------------------------------------------
   البامفلت - مرحلة تصميم الكتاب فقط
   10 صفحات فارغة جاهزة لاستقبال المحتوى لاحقًا.
   ---------------------------------------------------------- */
const pamphletPages = Array.from({ length: 10 }, (_, i) => ({
  title: `صفحة ${i + 1}`,
  icon: '📖',
  html: `
    <div class="blank-book-page" aria-label="صفحة ${i + 1}">
      <span class="blank-page-number">${String(i + 1).padStart(2, '0')}</span>
    </div>
  `
}));

const paper = document.getElementById('pamphletPaper');
const content = document.getElementById('paperContent');
const counter = document.getElementById('pageCounter');
const dots = document.getElementById('pageDots');
const index = document.getElementById('pamphletIndex');
const indexList = document.getElementById('indexList');
let currentPage = 0;
let turning = false;
let touchStartX = 0;
let touchStartY = 0;

function arabicNumber(n) {
  return String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
}

function updatePageChrome(n) {
  counter.textContent = `صفحة ${arabicNumber(n + 1)} من ${arabicNumber(pamphletPages.length)}`;
  [...dots.children].forEach((d, i) => d.classList.toggle('active', i === n));
  [...indexList.children].forEach((d, i) => d.classList.toggle('active', i === n));
}

function setPage(n) {
  const page = pamphletPages[n];
  content.innerHTML = page.html;
  updatePageChrome(n);
}

function renderPage(n, direction = 'next', instant = false) {
  if (turning || n < 0 || n >= pamphletPages.length || n === currentPage && !instant) return;

  if (instant) {
    currentPage = n;
    setPage(n);
    return;
  }

  turning = true;
  paper.classList.remove('flip-next', 'flip-prev');
  void paper.offsetWidth;
  paper.classList.add(direction === 'next' ? 'flip-next' : 'flip-prev');

  setTimeout(() => {
    currentPage = n;
    setPage(n);
    paper.classList.remove('flip-next', 'flip-prev');
    turning = false;
  }, 680);
}

function goToPage(n) {
  if (n < 0 || n >= pamphletPages.length || turning) return;
  renderPage(n, n > currentPage ? 'next' : 'prev');
}

/* النقاط السفلية */
dots.innerHTML = pamphletPages.map((p, i) =>
  `<button type="button" aria-label="صفحة ${i + 1}" data-page="${i}"></button>`
).join('');

/* فهرس بسيط مؤقتًا - المحتوى سنضعه لاحقًا */
indexList.innerHTML = pamphletPages.map((p, i) => `
  <button type="button" data-page="${i}">
    <span>📖</span>
    <strong>صفحة ${arabicNumber(i + 1)}</strong>
    <small>من أصل ${arabicNumber(pamphletPages.length)} صفحات</small>
  </button>
`).join('');

dots.addEventListener('click', e => {
  const b = e.target.closest('[data-page]');
  if (b) goToPage(Number(b.dataset.page));
});

indexList.addEventListener('click', e => {
  const b = e.target.closest('[data-page]');
  if (!b) return;
  goToPage(Number(b.dataset.page));
  index.classList.remove('open');
  index.setAttribute('aria-hidden', 'true');
});

document.getElementById('prevBtn').addEventListener('click', () => goToPage(currentPage - 1));
document.getElementById('nextBtn').addEventListener('click', () => goToPage(currentPage + 1));

document.getElementById('indexBtn').addEventListener('click', () => {
  index.classList.add('open');
  index.setAttribute('aria-hidden', 'false');
});

document.getElementById('indexClose').addEventListener('click', () => {
  index.classList.remove('open');
  index.setAttribute('aria-hidden', 'true');
});

index.addEventListener('click', e => {
  if (e.target === index) {
    index.classList.remove('open');
    index.setAttribute('aria-hidden', 'true');
  }
});

/* لوحة المفاتيح */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') goToPage(currentPage - 1);
  if (e.key === 'ArrowLeft') goToPage(currentPage + 1);
  if (e.key === 'Escape') {
    index.classList.remove('open');
    index.setAttribute('aria-hidden', 'true');
  }
});

/* السحب على الموبايل */
paper.addEventListener('touchstart', e => {
  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
}, { passive: true });

paper.addEventListener('touchend', e => {
  const x = e.changedTouches[0].screenX;
  const y = e.changedTouches[0].screenY;
  const dx = x - touchStartX;
  const dy = y - touchStartY;

  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)) {
    if (dx < 0) goToPage(currentPage + 1);
    else goToPage(currentPage - 1);
  }
}, { passive: true });

setPage(0);
</script>
</body>
</html>
