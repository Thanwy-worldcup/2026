<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>البامفلت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=stpageflip-book-2">
</head>
<body>

<header class="site-header">
  <div class="container">
    <div class="brand">
      <img src="assets/img/logo.jpg" alt="لوجو المؤتمر">
      <div>
        <span class="brand-name">مؤتمر شباب ثانوي</span>
        <div class="brand-sub">كنيسة البابا اثناسيوس الرسولي - بقليوب المحطة</div>
      </div>
    </div>
    <button class="nav-toggle" onclick="toggleNav()" aria-label="فتح القائمة" aria-expanded="false">☰</button>
    <nav class="main-nav" id="mainNav" onclick="if(event.target===this) toggleNav()">
      <a href="index.html">الرئيسية</a>
      <a href="teams.html">المنتخبات</a>
      <a href="pamphlet.html">البامفلت</a>
      <a href="schedule.html">الأنشطة والمواعيد</a>
      <a href="rules.html">اللوائح</a>
      <a href="gallery.html">معرض الصور</a>
    </nav>
  </div>
</header>

<main class="pamphlet-book-page">
  <section class="flipbook-stage" aria-label="بامفلت المؤتمر">
    <div class="book-shell">
      <div id="flipbook" class="flipbook" aria-label="كتاب البامفلت"></div>
    </div>

    <div class="book-controls" aria-label="أدوات تقليب الصفحات">
      <button type="button" class="book-btn" id="prevPage" aria-label="الصفحة السابقة">‹</button>
      <div class="page-counter" aria-live="polite">
        <span id="pageCurrent">1</span><span class="counter-sep">/</span><span>10</span>
      </div>
      <button type="button" class="book-btn" id="nextPage" aria-label="الصفحة التالية">›</button>
    </div>

    <p class="book-hint">اسحب من زاوية الصفحة أو استخدم الأسهم لتقليب الكتاب</p>
  </section>
</main>

<footer class="site-footer">
  <div class="container footer-flex">
    <div class="footer-verse" data-footer-verse></div>
    <div class="footer-qr-badge">
      <img src="assets/img/qr-code.png" alt="امسح لفتح الموقع">
    </div>
  </div>
</footer>

<!-- StPageFlip: نفس المحرك المستخدم في الـDemo الذي اخترته -->
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
<script src="assets/app.js?v=stpageflip-book-2"></script>
<script>
(() => {
  function initPamphletBook() {
    const host = document.getElementById('flipbook');
    if (!host || !window.St || !window.St.PageFlip) {
      console.error('StPageFlip library did not load.');
      return;
    }

    // 10 صفحات فارغة مؤقتًا — سنبني محتوى كل صفحة واحدة واحدة لاحقًا.
    host.innerHTML = '';
    for (let i = 0; i < 10; i++) {
      const page = document.createElement('div');
      page.className = 'book-page';
      page.dataset.density = 'soft';
      page.innerHTML = `
        <div class="page-inner">
          <span class="page-corner page-corner-tl"></span>
          <span class="page-corner page-corner-tr"></span>
          <span class="page-corner page-corner-bl"></span>
          <span class="page-corner page-corner-br"></span>
          <span class="page-number">${i + 1}</span>
        </div>`;
      host.appendChild(page);
    }

    const pageFlip = new St.PageFlip(host, {
      // نسبة صفحة Portrait مثل كتيب حقيقي
      width: 560,
      height: 760,

      // Stretch = يملأ المساحة المتاحة مع الحفاظ على النسبة
      size: 'stretch',
      minWidth: 280,
      maxWidth: 620,
      minHeight: 390,
      maxHeight: 900,

      // أهم إعدادات الإحساس الواقعي
      drawShadow: true,
      maxShadowOpacity: 0.55,
      flippingTime: 1050,
      usePortrait: true,
      mobileScrollSupport: false,
      swipeDistance: 25,
      showCover: false,
      autoSize: true,
      startZIndex: 0,
      startPage: 0
    });

    pageFlip.loadFromHTML(host.querySelectorAll('.book-page'));

    const current = document.getElementById('pageCurrent');
    const prev = document.getElementById('prevPage');
    const next = document.getElementById('nextPage');

    function updateCounter(index = pageFlip.getCurrentPageIndex()) {
      current.textContent = String(index + 1);
      prev.disabled = index <= 0;
      next.disabled = index >= pageFlip.getPageCount() - 1;
    }

    pageFlip.on('flip', (event) => updateCounter(Number(event.data)));
    pageFlip.on('init', (event) => updateCounter(Number(event.data.page || 0)));

    prev.addEventListener('click', () => pageFlip.flipPrev('top'));
    next.addEventListener('click', () => pageFlip.flipNext('bottom'));

    document.addEventListener('keydown', (event) => {
      if (event.target.matches('input, textarea, select, button, a')) return;
      if (event.key === 'ArrowRight') pageFlip.flipPrev('top');
      if (event.key === 'ArrowLeft') pageFlip.flipNext('bottom');
    });

    updateCounter(0);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initPamphletBook);
  } else {
    initPamphletBook();
  }
})();
</script>
<script>markActiveNav(); renderFooterVerse(5);</script>
</body>
</html>
